<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <h1>Text Formating in HTML?</h1>
    <ul>
        <li>
            <b> - Bold text</li>
<li><strong> - Important text</li>
<li><i> - Italic text</li>
<li><em> - Emphasized text</li>
<li><mark> - Marked text</li>
<li><small> - Smaller text</li>
<li><del> - Deleted text</li>
<li><ins> - Inserted text</li>
<li> - Subscript text  H<sub>2</sub>O</li>
<li>- Superscript text  a<sup>2</sup></li>
    </ul>
</body>
</html>
