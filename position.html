<body>
  <h1>Position--</h1> 
  <ul class="position">
    <li>Static</li>
    <li>relative</li>
    <li>fixed</li>
    <li>sticky</li>
    <li>absolute</li>
  </ul> 
<h1 class="relative">--Relative position practice--</h1>
<!--relative for carry anywhere to value-->
<div id="relative">
  
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</div><br><br><br><br>
<h1 class="fixed">--fixed position practice--</h1>
<!--This is for fixed on website show on top & anywhere u want to fixed.when we fixed the positon then can't scroll it.-->
<div id="fixed">
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
</div>
</body>
</html>
